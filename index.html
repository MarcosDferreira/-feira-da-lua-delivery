
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feira da Lua Delivery</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background-color:#071638;
 color:#fff;
 background-image:
 radial-gradient(#ffffff55 1px,transparent 1px),
 radial-gradient(#ffffff33 1px,transparent 1px);
 background-size:37px 37px,61px 61px;
 background-position:0 0,18px 22px;
}

header{
 background:linear-gradient(180deg,#071638,#10265a);
 text-align:center;
 padding:25px 15px;
 border-bottom:3px solid #df4c91;
}

header h1{font-size:27px;margin:8px 0}
header p{color:#f5f5ff}

main{max-width:700px;margin:auto;padding:18px}

h2,h3{color:#fff}

input{
 width:100%;
 padding:13px;
 margin:7px 0 14px;
 border:1px solid #cbd4e7;
 border-radius:8px;
 font-size:16px;
 background:#fff;
 color:#102044;
}

button{
 background:#f2ad35;
 color:#102044;
 border:0;
 padding:12px;
 border-radius:8px;
 font-weight:bold;
 cursor:pointer;
}

.barraca,.carrinho{
 background:#fff;
 color:#102044;
 padding:16px;
 border-radius:12px;
 margin:15px 0;
 box-shadow:0 5px 18px #0003;
}

.barraca h3{color:#10265a}

.produto{
 display:flex;
 flex-direction:column;
 gap:10px;
 border-top:1px solid #e6eaf2;
 padding:15px 0;
}

.produto-conteudo{
 display:flex;
 align-items:center;
 gap:13px;
}

.foto-produto{
 width:105px;
 height:105px;
 object-fit:cover;
 border-radius:10px;
 background:#e9edf5;
 flex-shrink:0;
}

.info-produto{flex:1;min-width:0}
.info-produto p{color:#53617b;margin:7px 0}
.preco{color:#10265a;font-weight:bold;margin-top:8px}

.produto button{width:100%}

.finalizar{
 width:100%;
 background:#10265a;
 color:white;
 margin-top:10px;
}

footer{
 text-align:center;
 padding:22px 15px;
 color:#fff;
}

.patrocinio{
 margin-top:10px;
 font-size:12px;
 color:#dce4ff;
}

.link-admin{
 margin-top:15px;
 font-size:12px;
}

.link-admin a{
 color:#dce4ff;
 text-decoration:none;
 opacity:.8;
}

.link-admin a:hover{
 text-decoration:underline;
 opacity:1;
}

@media(max-width:480px){
 .foto-produto{width:90px;height:90px}
 .produto-conteudo{align-items:flex-start}
}
</style>
</head>

<body>

<header>
<h1>Feira da Lua Delivery</h1>
<p>Os sabores da nossa feira na sua casa!</p>
</header>

<main>

<input id="busca" placeholder="Buscar produtos ou barracas..." aria-label="Buscar produtos ou barracas">

<h2>Conheça nossas barracas</h2>
<div id="vitrine">Carregando produtos...</div>

<section class="carrinho">
<h2>Meu carrinho (<span id="quantidade">0</span>)</h2>
<ul id="itens"><li>Nenhum produto adicionado.</li></ul>
<p><strong>Total: R$ <span id="total">0,00</span></strong></p>
<button class="finalizar" onclick="finalizar()">Finalizar pedido</button>
</section>

</main>

<footer>
 Feira da Lua de Ribeirão Grande

 <div class="patrocinio">
  Patrocínio: LEGADU Festas &amp; Eventos
 </div>

 <div class="link-admin">
  <a href="admin.html">Área administrativa</a>
 </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL='https://bnnfplpccsxaaztgbxkr.supabase.co';
const SUPABASE_KEY='sb_publishable_dws08TQirwdC5MI3UITfog_AWVc8eL5';

const banco=window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

let carrinho=[];
let produtos=[];
let barracas=[];

async function carregarProdutos(){
 const vitrine=document.getElementById('vitrine');

 try{
  const {data:listaBarracas,error:e1}=await banco
   .from('feirantes')
   .select('id,nome,responsavel')
   .eq('ativo',true);

  if(e1)throw e1;

  const {data:lista,error:e2}=await banco
   .from('produtos')
   .select('id,feirante_id,nome,preco,descricao,imagem_url')
   .eq('ativo',true);

  if(e2)throw e2;

  produtos=lista||[];
  barracas=listaBarracas||[];

  vitrine.innerHTML='';

  barracas.forEach(b=>{
   const listaBarraca=produtos.filter(
    p=>Number(p.feirante_id)===Number(b.id)
   );

   if(!listaBarraca.length)return;

   const sec=document.createElement('section');
   sec.className='barraca';

   const titulo=document.createElement('h3');
   titulo.textContent=b.nome;
   sec.appendChild(titulo);

   listaBarraca.forEach(p=>{
    const item=document.createElement('div');
    item.className='produto';
    item.dataset.nome=p.nome.toLowerCase();

    const conteudo=document.createElement('div');
    conteudo.className='produto-conteudo';

    if(p.imagem_url){
     const foto=document.createElement('img');
     foto.className='foto-produto';
     foto.src=p.imagem_url;
     foto.alt=p.nome;
     foto.loading='lazy';
     conteudo.appendChild(foto);
    }

    const info=document.createElement('div');
    info.className='info-produto';

    const nome=document.createElement('strong');
    nome.textContent=p.nome;

    const desc=document.createElement('p');
    desc.textContent=p.descricao||'';

    const preco=document.createElement('div');
    preco.className='preco';
    preco.textContent=Number(p.preco).toLocaleString(
     'pt-BR',
     {style:'currency',currency:'BRL'}
    );

    info.append(nome,desc,preco);
    conteudo.appendChild(info);

    const botao=document.createElement('button');
    botao.textContent='Adicionar';
    botao.onclick=()=>adicionar(p.id,p.nome,Number(p.preco));

    item.append(conteudo,botao);
    sec.appendChild(item);
   });

   vitrine.appendChild(sec);
  });

  if(!vitrine.children.length){
   vitrine.textContent='Nenhum produto disponível.';
  }

  aplicarBusca();

 }catch(e){
  console.error(e);
  vitrine.textContent='Erro ao carregar produtos. Atualize a página.';
 }
}

function aplicarBusca(){
 const campo=document.getElementById('busca');
 const termo=campo.value.trim().toLowerCase();

 document.querySelectorAll('#vitrine .barraca').forEach(barraca=>{
  const nomeBarraca=barraca.querySelector('h3').textContent.toLowerCase();
  let encontrou=false;

  barraca.querySelectorAll('.produto').forEach(produto=>{
   const nomeProduto=produto.dataset.nome||'';
   const corresponde=!termo||
    nomeProduto.includes(termo)||
    nomeBarraca.includes(termo);

   produto.style.display=corresponde?'flex':'none';

   if(corresponde)encontrou=true;
  });

  barraca.style.display=encontrou?'block':'none';
 });
}

document.getElementById('busca').addEventListener('input',aplicarBusca);

function adicionar(id,nome,preco){
 carrinho.push({id,nome,preco});
 atualizar();
}

function atualizar(){
 document.getElementById('quantidade').textContent=carrinho.length;

 const lista=document.getElementById('itens');
 lista.innerHTML='';

 carrinho.forEach(p=>{
  const li=document.createElement('li');
  li.textContent=p.nome+' - '+p.preco.toLocaleString(
   'pt-BR',
   {style:'currency',currency:'BRL'}
  );
  lista.appendChild(li);
 });

 if(!carrinho.length){
  lista.innerHTML='<li>Nenhum produto adicionado.</li>';
 }

 const total=carrinho.reduce((s,p)=>s+p.preco,0);
 document.getElementById('total').textContent=
  total.toFixed(2).replace('.',',');
}

function finalizar(){
 if(!carrinho.length){
  alert('Adicione produtos ao carrinho.');
  return;
 }

 const nomeCliente=prompt('Qual é o seu nome?');
 if(nomeCliente===null)return;

 if(!nomeCliente.trim()){
  alert('Informe seu nome para continuar.');
  return;
 }

 const endereco=prompt('Informe o endereço para entrega ou escreva "Retirar na feira".');
 if(endereco===null)return;

 if(!endereco.trim()){
  alert('Informe o endereço ou a opção de retirada.');
  return;
 }

 const resumo={};

 carrinho.forEach(p=>{
  if(!resumo[p.id]){
   resumo[p.id]={nome:p.nome,preco:p.preco,quantidade:0};
  }
  resumo[p.id].quantidade++;
 });

 const linhas=Object.values(resumo).map(p=>{
  const subtotal=p.preco*p.quantidade;
  return p.quantidade+'x '+p.nome+' - '+subtotal.toLocaleString(
   'pt-BR',
   {style:'currency',currency:'BRL'}
  );
 });

 const total=carrinho.reduce((s,p)=>s+p.preco,0);

 const mensagemPedido=[
  'Olá! Quero fazer um pedido pela Feira da Lua Delivery.',
  '',
  'Nome: '+nomeCliente.trim(),
  'Entrega/retirada: '+endereco.trim(),
  '',
  'Pedido:',
  ...linhas,
  '',
  'Total: '+total.toLocaleString(
   'pt-BR',
   {style:'currency',currency:'BRL'}
  ),
  '',
  'Aguardo a confirmação. Obrigado!'
 ].join('\n');

 const telefone='5515997549326';
 const url='https://wa.me/'+telefone+'?text='+encodeURIComponent(mensagemPedido);

 window.open(url,'_blank');
}

carregarProdutos();
</script>

</body>
</html>
