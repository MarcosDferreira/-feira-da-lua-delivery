
<style>
*{box-sizing:border-box}

:root{
 --fundo:#071638;
 --azul:#123778;
 --azul-claro:#2464bd;
 --vermelho:#e53945;
 --branco:#fff;
 --texto:#172746;
}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:var(--fundo);
 color:var(--branco);
 background-image:
 radial-gradient(#ffffff35 1px,transparent 1px),
 radial-gradient(#ffffff20 1px,transparent 1px);
 background-size:37px 37px,61px 61px;
 background-position:0 0,18px 22px;
}

header{
 background:linear-gradient(180deg,#071638,#102b60);
 text-align:center;
 padding:25px 15px 30px;
 border-bottom:3px solid var(--azul-claro);
}

.logo-feira{
 width:210px;
 max-width:75%;
 height:auto;
 display:block;
 margin:0 auto 15px;
 border:0;
 border-radius:0;
 background:transparent;
 box-shadow:none;
}

header h1{
 font-size:28px;
 margin:8px 0;
 color:#fff;
}

header p{
 color:#e3ebff;
 font-size:17px;
 margin:10px 0;
}

header span{
 display:block;
 color:#fff;
 font-size:13px;
 margin-top:12px;
}

main{
 max-width:700px;
 margin:auto;
 padding:18px;
}

h2,h3{color:#fff}

#busca{
 width:100%;
 padding:15px;
 margin:7px 0 20px;
 border:2px solid #31558c;
 border-radius:12px;
 font-size:16px;
 background:#fff;
 color:#102044;
 outline:none;
}

#busca:focus{
 border-color:#e53945;
}

main>h2{
 font-size:22px;
 margin:20px 0;
}

button{
 background:var(--azul-claro);
 color:#fff;
 border:0;
 padding:13px;
 border-radius:9px;
 font-weight:bold;
 font-size:15px;
 cursor:pointer;
 transition:.2s;
}

button:hover{
 background:#174b9c;
}

button:disabled{
 background:#aeb5c2;
 color:#fff;
 cursor:not-allowed;
}

.barraca,.carrinho{
 background:#fff;
 color:var(--texto);
 padding:17px;
 border-radius:15px;
 margin:16px 0;
 box-shadow:0 6px 20px #0004;
}

.barraca h3{
 color:#123778;
 font-size:20px;
 margin:0 0 10px;
 padding-bottom:10px;
 border-bottom:2px solid #e7edf7;
}

.produto{
 display:flex;
 flex-direction:column;
 gap:11px;
 border-top:1px solid #e6eaf2;
 padding:17px 0;
}

.produto-conteudo{
 display:flex;
 align-items:center;
 gap:13px;
}

.foto-produto{
 width:105px;
 height:105px;
 object-fit:cover;
 border-radius:11px;
 background:#e9edf5;
 flex-shrink:0;
}

.info-produto{
 flex:1;
 min-width:0;
}

.info-produto strong{
 color:#142b54;
 font-size:16px;
}

.info-produto p{
 color:#53617b;
 margin:7px 0;
 font-size:14px;
}

.preco{
 color:#174b9c;
 font-weight:bold;
 font-size:17px;
 margin-top:8px;
}

.produto button{
 width:100%;
 background:#e53945;
 color:#fff;
}

.produto button:hover{
 background:#c62836;
}

.estoque{
 font-size:13px;
 font-weight:bold;
 margin-top:8px;
}

.esgotado{color:#d62828}
.ultimas{color:#d97706}
.disponivel{color:#16834a}

.carrinho h2{
 color:#123778;
 margin-top:0;
}

.carrinho ul{
 padding-left:22px;
 line-height:1.8;
}

.carrinho p{
 color:#172746;
}

.finalizar{
 width:100%;
 background:#e53945;
 color:white;
 margin-top:10px;
 padding:15px;
 font-size:16px;
}

.finalizar:hover{
 background:#c62836;
}

#mensagem{
 text-align:center;
 font-weight:bold;
 margin:12px 0;
 overflow-wrap:anywhere;
 color:#174b9c;
}

footer{
 text-align:center;
 padding:28px 15px;
 color:#fff;
 background:linear-gradient(180deg,#071638,#0d2450);
 border-top:2px solid #244a85;
}

.patrocinio{
 margin-top:20px;
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:10px;
}

.patrocinio p{
 color:#dce4ff;
 font-size:13px;
 margin:0;
}

.logo-legadu{
 width:100%;
 max-width:310px;
 height:auto;
 border-radius:0;
 background:transparent;
 padding:0;
}

.link-admin{
 margin-top:18px;
 font-size:12px;
}

.link-admin a{
 color:#dce4ff;
 text-decoration:none;
 opacity:.8;
}

.link-admin a:hover{
 text-decoration:underline;
 opacity:1;
}

@media(max-width:480px){
 main{padding:13px}
 .foto-produto{width:90px;height:90px}
 .produto-conteudo{align-items:flex-start}
 .logo-feira{width:185px}
 header h1{font-size:25px}
 .barraca,.carrinho{padding:14px}
}
</style>
